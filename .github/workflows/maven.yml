# Workflow CI: Build, test và publish report tự động khi push/PR vào nhánh main
# Ref: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Run Maven with GitHub CI

on:
   workflow_dispatch:    # Cho phép chạy thủ công trên GitHub UI và chọn cấu hình
      inputs:
         browser:
            description: 'Chọn trình duyệt kiểm thử'
            required: false
            default: 'chrome'
            type: choice
            options:
               - chrome
               - edge
               - firefox
         suite:
            description: 'Chọn Test Suite XML muốn chạy'
            required: false
            default: 'SuiteAll.xml'
            type: choice
            options:
               - SuiteAll.xml
               - CRM/SignIn-parallel-methods.xml
               - CRM/Dashboard-parallel-methods.xml
               - CRM/TopBarTest-parallel-methods.xml
               - CRM/Project-parallel-methods.xml
         headless:
            description: 'Chạy ngầm (Headless mode)'
            required: false
            default: true
            type: boolean
   push:
      branches: [ "main" ]         # Trigger khi push lên main
   pull_request:
      branches: [ "main" ]         # Trigger khi tạo PR vào main
   # schedule:
   #    - cron: '0 19 * * *'         # Nightly build tự động chạy lúc 2h00 sáng VN (19:00 UTC)

jobs:
   build:
      # Các lựa chọn hệ điều hành Runner trên GitHub Actions:
      # - ubuntu-latest  : Linux (Khuyên dùng: Khởi động nhanh nhất, ít lỗi mạng, tiết kiệm quota phút chạy)
      # - windows-latest : Windows Server (Dùng khi test case yêu cầu môi trường Windows)
      # - macos-latest   : macOS (Dùng cho test Safari/iOS/Mac, tốn x10 quota phút chạy)
      runs-on: windows-latest

      steps:
         # 1. Tải source code về runner (toàn bộ lịch sử commit)
         -  uses: actions/checkout@v4
            with:
               fetch-depth: 0

         # 2. Cài JDK 17 (Amazon Corretto) và cache Maven dependencies
         -  name: Set up JDK 17
            uses: actions/setup-java@v5
            with:
               distribution: 'corretto'
               java-version: '17'
               cache: maven

         # 3. Chạy toàn bộ test cases
         -  name: Run test with Maven
            shell: bash
            env:
               TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
               TELEGRAM_CHATID: ${{ secrets.TELEGRAM_CHATID }}
            run: |
               SUITE_NAME="${{ github.event.inputs.suite || 'SuiteAll.xml' }}"
               BROWSER_NAME="${{ github.event.inputs.browser || 'chrome' }}"
               HEADLESS_MODE="${{ github.event.inputs.headless != '' && github.event.inputs.headless || 'true' }}"
               echo "Running suite: $SUITE_NAME on browser: $BROWSER_NAME (headless=$HEADLESS_MODE)"
               mvn clean test --file pom.xml \
                 -DsuiteXmlFile="src/test/resources/suites/$SUITE_NAME" \
                 -DBROWSER="$BROWSER_NAME" \
                 -DHEADLESS="$HEADLESS_MODE" \
                 -DENCRYPTION_KEY="${{ secrets.ENCRYPTION_KEY }}"

         # 4. Lấy lịch sử Allure từ gh-pages (để hiển thị trend report)
         -  name: Get Allure history
            uses: actions/checkout@v4
            if: always()
            continue-on-error: true
            with:
               ref: gh-pages
               path: gh-pages

         # 5. Copy lịch sử cũ vào thư mục allure-results
         -  name: Copy Allure history
            if: always()
            continue-on-error: true
            shell: bash
            run: |
               mkdir -p target/allure-results/history
               cp -Rr gh-pages/history/* target/allure-results/history/ || true

         # 6. Generate báo cáo Allure HTML
         -  name: Generate Allure Report
            if: always()
            run: mvn allure:report --file pom.xml

         -  name: Override Allure Executor for GitHub Actions
            if: always()
            shell: pwsh
            run: |
               $serverUrl = if ($env:GITHUB_SERVER_URL) { $env:GITHUB_SERVER_URL } else { "https://github.com" }
               $repo = $env:GITHUB_REPOSITORY
               $runId = $env:GITHUB_RUN_ID
               $runNumber = $env:GITHUB_RUN_NUMBER
               $actor = $env:GITHUB_ACTOR

               $repoUrl = "$serverUrl/$repo"
               $buildUrl = if ($runId) { "$repoUrl/actions/runs/$runId" } else { "$repoUrl/actions" }
               $reportUrl = "https://$($repo.Split('/')[0].ToLower()).github.io/$($repo.Split('/')[1])"

               $executorData = @(
                   @{
                       name = "GitHub Actions"
                       type = "github"
                       url = $repoUrl
                       buildOrder = [int]$runNumber
                       buildName = "Run #$runNumber ($actor)"
                       buildUrl = $buildUrl
                       reportUrl = $reportUrl
                       reportName = "Allure Report | CRM-Automation-Framework"
                   }
               )

               $singleJson = ($executorData | ConvertTo-Json -Depth 5).Trim()
               $jsonArray = "[$singleJson]"

               $destWidget = "target/site/allure-maven-plugin/widgets/executors.json"
               New-Item -ItemType Directory -Force -Path "target/site/allure-maven-plugin/widgets" | Out-Null
               $jsonArray | Set-Content $destWidget -Encoding UTF8
               Write-Host "Overwritten $destWidget with GitHub Actions executor array!"

               # Ghi thêm vào data/
               $destData = "target/site/allure-maven-plugin/data/executors.json"
               New-Item -ItemType Directory -Force -Path "target/site/allure-maven-plugin/data" | Out-Null
               $jsonArray | Set-Content $destData -Encoding UTF8

               $destResults = "target/allure-results/executor.json"
               $singleJson | Set-Content $destResults -Encoding UTF8

         # 7. Upload Extent Report lên Artifacts (HTML và PDF)
         -  name: Upload Extent Report
            if: always()
            uses: actions/upload-artifact@v4
            with:
               name: extent-report
               path: |
                  exports/ExtentReports/ExtentReports.html
                  exports/ExtentReports/ExtentReports.pdf

         # 8. Upload Allure Report lên Artifacts
         -  name: Upload Allure Report
            if: always()
            uses: actions/upload-artifact@v4
            with:
               name: allure-report
               path: target/site/allure-maven-plugin/

         # 9. Upload video ghi lại quá trình chạy test
         -  name: Upload videos for tests
            if: always()
            uses: actions/upload-artifact@v4
            with:
               name: test-videos
               path: exports/ExportData/Videos

         # 10. Upload screenshot khi test fail
         -  name: Upload screenshots for tests
            if: always()
            uses: actions/upload-artifact@v4
            with:
               name: test-screenshots
               path: exports/ExportData/Images

         # 11. Deploy Allure Report lên GitHub Pages
         -  name: Deploy Allure Report to GitHub Pages
            if: always()
            uses: peaceiris/actions-gh-pages@v4
            with:
               github_token: ${{ secrets.GITHUB_TOKEN }}
               publish_branch: gh-pages
               publish_dir: target/site/allure-maven-plugin

         # 12. Gửi báo cáo tổng kết duy nhất 1 lần qua Telegram Bot
         -  name: Send Telegram Notification
            if: always()
            shell: pwsh
            env:
               TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
               TELEGRAM_CHATID: ${{ secrets.TELEGRAM_CHATID }}
               JOB_STATUS: ${{ job.status }}
               RUN_NUMBER: ${{ github.run_number }}
               ACTOR: ${{ github.actor }}
               BRANCH: ${{ github.ref_name }}
               COMMIT_MSG: ${{ github.event.head_commit.message }}
            run: |
               $token = $env:TELEGRAM_TOKEN
               $chatId = $env:TELEGRAM_CHATID

               if (-not $token -or -not $chatId) {
                   Write-Host "Chưa cấu hình TELEGRAM_TOKEN hoặc TELEGRAM_CHATID trong Secrets, bỏ qua gửi Telegram."
                   exit 0
               }

               $total = 0
               $passed = 0
               $failed = 0
               $skipped = 0

               $summaryFile = "target/site/allure-maven-plugin/widgets/summary.json"
               $testngFile = "target/surefire-reports/testng-results.xml"

               if (Test-Path $summaryFile) {
                   try {
                       $summary = Get-Content $summaryFile -Raw -Encoding UTF8 | ConvertFrom-Json
                       $total = [int]$summary.statistic.total
                       $passed = [int]$summary.statistic.passed
                       $failed = [int]$summary.statistic.failed + [int]$summary.statistic.broken
                       $skipped = [int]$summary.statistic.skipped
                   } catch {
                       Write-Host "Lỗi đọc summary.json: $_"
                   }
               } elseif (Test-Path $testngFile) {
                   try {
                       [xml]$xml = Get-Content $testngFile
                       $total = [int]$xml."testng-results".total
                       $passed = [int]$xml."testng-results".passed
                       $failed = [int]$xml."testng-results".failed
                       $skipped = [int]$xml."testng-results".skipped
                   } catch {
                       Write-Host "Lỗi đọc testng-results.xml: $_"
                   }
               }

               $jobStatus = $env:JOB_STATUS
               $statusEmoji = if ($failed -eq 0 -and $total -gt 0 -and $jobStatus -eq "success") { "✅ PASS TOÀN BỘ" } else { "❌ CÓ TEST FAIL" }
               $runNumber = $env:RUN_NUMBER
               $actor = $env:ACTOR
               $branch = $env:BRANCH
               $commitMsg = if ($env:COMMIT_MSG) { $env:COMMIT_MSG.Split("`n")[0] } else { "Automation Run" }
               $now = [DateTime]::UtcNow.AddHours(7).ToString('dd/MM/yyyy HH:mm:ss')
               $repoOwner = $env:GITHUB_REPOSITORY.Split('/')[0].ToLower()
               $repoName = $env:GITHUB_REPOSITORY.Split('/')[1]
               $allureUrl = "https://${repoOwner}.github.io/${repoName}"

               $lines = @(
                   "🚀 <b>KẾT QUẢ AUTOMATION TEST CRM</b> 🚀",
                   "Trạng thái: <b>$statusEmoji</b>",
                   "━━━━━━━━━━━━━━━━━━━",
                   "🔖 Lần chạy: <b>Build #$runNumber (nhánh $branch)</b>",
                   "👤 Người chạy: <b>$actor</b>",
                   "🕒 Thời gian: <b>$now</b>",
                   "📝 Commit: <i>$commitMsg</i>",
                   "━━━━━━━━━━━━━━━━━━━",
                   "📊 Tổng số test cases: <b>$total</b>",
                   "✅ Passed: <b>$passed</b>",
                   "❌ Failed: <b>$failed</b>",
                   "⚠️ Skipped: <b>$skipped</b>",
                   "━━━━━━━━━━━━━━━━━━━",
                   "🔗 <a href=`"$allureUrl`">Xem Allure Report trực tuyến</a>"
               )
               $message = $lines -join "`n"

               # 1. Gửi tin nhắn tóm tắt
               $sendMsgUri = "https://api.telegram.org/bot$token/sendMessage"
               $body = @{
                   chat_id = $chatId
                   text = $message
                   parse_mode = "HTML"
               } | ConvertTo-Json
               try {
                   Invoke-RestMethod -Uri $sendMsgUri -Method Post -Body $body -ContentType "application/json; charset=utf-8"
                   Write-Host "Gửi tin nhắn Telegram thành công!"
               } catch {
                   Write-Host "Lỗi gửi tin nhắn Telegram: $_"
               }

               # 2. Gửi đính kèm file ExtentReports.html nếu tồn tại
               $reportFile = "exports/ExtentReports/ExtentReports.html"
               if (Test-Path $reportFile) {
                   try {
                       curl.exe -s -X POST "https://api.telegram.org/bot$token/sendDocument" -F "chat_id=$chatId" -F "document=@$reportFile" -F "caption=📊 Báo cáo chi tiết ExtentReports"
                       Write-Host "Gửi file ExtentReports.html lên Telegram thành công!"
                   } catch {
                       Write-Host "Lỗi gửi file ExtentReports: $_"
                   }
               }
